plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '0.1'

repositories {
    mavenCentral()
}

dependencies {
    providedCompile 'javax.servlet:javax.servlet-api:6.0.0'

    implementation 'org.postgresql:postgresql:42.7.7'

    implementation 'org.hibernate:hibernate-hikaricp:6.2.5.Final'

    implementation 'org.hibernate.orm:hibernate-core:6.2.5.Final'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

    implementation 'org.slf4j:slf4j-api:2.0.7'

    runtimeOnly 'ch.qos.logback:logback-classic:1.5.13'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

war {
    archiveBaseName = 'tennis-scoreboard-app'
}
test {
    useJUnitPlatform()
}